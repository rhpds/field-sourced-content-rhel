---
- name: Install Cockpit packages
  ansible.builtin.package:
    name: "{{ example_cockpit_packages }}"
    state: present

- name: Ensure cockpit config directory exists
  ansible.builtin.file:
    path: /etc/cockpit
    state: directory
    mode: "0755"

- name: Configure Cockpit for reverse proxy access
  ansible.builtin.template:
    src: cockpit.conf.j2
    dest: /etc/cockpit/cockpit.conf
    mode: "0644"
  notify: Restart cockpit

- name: Start and enable cockpit.socket
  ansible.builtin.service:
    name: cockpit.socket
    state: started
    enabled: true

- name: Configure bastion reverse proxy for Cockpit
  when: field_asset.enable_bastion_proxy | default(false) | bool
  delegate_to: "{{ groups['bastions'][0] }}"
  run_once: true
  block:
    - name: Write Cockpit reverse proxy locations
      ansible.builtin.template:
        src: cockpit-proxy.conf.j2
        dest: /etc/nginx/proxy.d/cockpit.conf
        mode: "0644"

    - name: Write landing page with Cockpit links
      ansible.builtin.template:
        src: index.html.j2
        dest: /usr/share/nginx/html/index.html
        mode: "0644"

    - name: Reload nginx
      ansible.builtin.command: nginx -s reload
      changed_when: true
