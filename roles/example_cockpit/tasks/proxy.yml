---
# Runs on bastions — writes Nginx reverse proxy config for each node's Cockpit.
# Assumes the platform already installed Nginx with an
# include /etc/nginx/proxy.d/*.conf inside the server block.

- name: Write Cockpit reverse proxy locations
  ansible.builtin.template:
    src: cockpit-proxy.conf.j2
    dest: /etc/nginx/proxy.d/cockpit.conf
    mode: "0644"
  notify: Reload nginx

- name: Write landing page with Cockpit links
  ansible.builtin.template:
    src: index.html.j2
    dest: /usr/share/nginx/html/index.html
    mode: "0644"
