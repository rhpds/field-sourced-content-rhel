---
- name: Install the proxy package
  ansible.builtin.package:
    name:
      - "{{ example_proxy_package }}"
      - policycoreutils-python-utils
    state: present

- name: Allow the proxy to bind the catalog Route ports
  ansible.builtin.command:
    argv:
      - semanage
      - port
      - -a
      - -t
      - http_cache_port_t
      - -p
      - tcp
      - "{{ item | string }}"
  loop: "{{ example_proxy_selinux_ports }}"
  register: r_semanage
  changed_when: r_semanage.rc == 0
  failed_when: >-
    r_semanage.rc != 0
    and 'already defined' not in (r_semanage.stderr | default(''))
    and 'SELinux is disabled' not in (r_semanage.stderr | default(''))

- name: Write proxy config
  ansible.builtin.template:
    src: proxy.conf.j2
    dest: "{{ example_proxy_config_path }}"
    mode: "0644"
  notify: Restart proxy

- name: Start and enable the proxy
  ansible.builtin.service:
    name: "{{ example_proxy_service }}"
    state: started
    enabled: true

- name: Check whether firewalld is running
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - firewalld
  register: r_firewalld
  changed_when: false
  failed_when: false

- name: Allow proxy ports through firewalld
  when: r_firewalld.rc == 0
  block:
    - name: Permanently add 8080 and 8443
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --permanent
          - --add-port={{ item }}/tcp
      loop: "{{ example_proxy_selinux_ports }}"
      register: r_fw_proxy
      changed_when: "'ALREADY_ENABLED' not in r_fw_proxy.stdout"
      failed_when: r_fw_proxy.rc != 0 and 'ALREADY_ENABLED' not in r_fw_proxy.stdout

    - name: Reload firewalld
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --reload
      when: r_fw_proxy.results | selectattr('changed') | list | length > 0
      changed_when: true
